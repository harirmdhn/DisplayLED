<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 Billboard — Big Screen</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/display.css" />
  </head>
  <body class="display">
    <!-- Idle loop shown between reveals -->
    <div id="idle" class="idle">
      <div class="idle-inner">
        <div class="speed-lines"></div>
        <h1 class="idle-title"><span class="flag">🏁</span> <span id="brand-title">RACE DAY</span></h1>
        <p class="idle-sub">Scan the QR code &amp; send your face to the grid</p>
      </div>
    </div>

    <!-- Reveal stage: layout mirrors a billboard (figure right, headline center,
         product + QR slot left). All copy/branding is generic & swappable. -->
    <div id="stage" class="stage hidden">
      <div class="bg-grid"></div>
      <div class="flash"></div>
      <div class="speed-lines reveal-lines"></div>
      <div class="checker-strip"></div>

      <!-- Left: product / sponsor slot (swap with your own licensed assets) -->
      <div class="product-slot">
        <div class="product-placeholder">YOUR<br />PRODUCT<br />HERE</div>
      </div>

      <!-- Center: headline -->
      <div class="caption">
        <div class="reveal-name"><span id="reveal-name">DRIVER</span></div>
        <div id="reveal-tagline" class="reveal-tagline">IS CLEARLY IN CONTROL</div>
        <div class="qr-slot">
          <div class="qr-placeholder">QR</div>
          <small>Scan &amp; upload your photo</small>
        </div>
      </div>

      <!-- Right: the generated figure, with subtle "living photo" motion -->
      <div class="figure-wrap">
        <div class="halo"></div>
        <div class="figure-motion">
          <img id="figure" class="figure" alt="" />
        </div>
      </div>
    </div>

    <script type="module" src="js/display.js"></script>
  </body>
</html>
