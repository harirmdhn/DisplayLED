<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <!-- Original generic racing-suit figure. No real team/sponsor/driver branding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305e"/>
      <stop offset="1" stop-color="#0f1733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#2b3a6b"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="340" rx="420" ry="420" fill="url(#glow)"/>

  <!-- Shoulders / torso -->
  <path d="M190 1200
           C 210 820, 250 640, 450 600
           C 650 640, 690 820, 710 1200 Z"
        fill="url(#suit)"/>

  <!-- Collar -->
  <path d="M360 612 C 400 596, 500 596, 540 612
           L 560 690 C 500 660, 400 660, 340 690 Z"
        fill="#0d1430"/>

  <!-- Accent stripes across the chest -->
  <path d="M250 820 L 650 820 L 640 866 L 260 866 Z" fill="url(#accent)"/>
  <path d="M268 884 L 632 884 L 626 912 L 274 912 Z" fill="#00b4d8"/>

  <!-- Shoulder accents -->
  <path d="M205 780 C 240 700, 320 668, 360 700 L 330 760 C 300 742, 250 760, 232 800 Z" fill="url(#accent)"/>
  <path d="M695 780 C 660 700, 580 668, 540 700 L 570 760 C 600 742, 650 760, 668 800 Z" fill="url(#accent)"/>

  <!-- Neck -->
  <rect x="402" y="470" width="96" height="150" rx="34" fill="#c9a07a"/>

  <!-- Head base (the selfie oval is drawn on top of this by composite.js) -->
  <ellipse cx="450" cy="300" rx="152" ry="187" fill="#0d1430"/>
  <ellipse cx="450" cy="300" rx="150" ry="185" fill="#1a2447"/>

  <!-- Faint number-ish badge on the chest (generic) -->
  <circle cx="450" cy="1010" r="58" fill="#0d1430" stroke="url(#accent)" stroke-width="6"/>
  <text x="450" y="1034" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="64" font-weight="800" fill="#ffffff">1</text>
</svg>
