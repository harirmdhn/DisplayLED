<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 Billboard Activation</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
      .landing {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        gap: 1.5rem;
      }
      .cards {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card {
        background: #121a33;
        border: 1px solid #263154;
        border-radius: 16px;
        padding: 1.5rem 2rem;
        max-width: 280px;
      }
      .card a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.7rem 1.1rem;
        border-radius: 10px;
        background: var(--team);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      #qr {
        background: #fff;
        padding: 12px;
        border-radius: 12px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main class="landing">
      <div>
        <h1>🏁 F1 Billboard Activation</h1>
        <p class="muted">Scan to join. Your face goes up on the big screen.</p>
      </div>

      <div id="qr"></div>
      <p class="muted" id="kiosk-link-text"></p>

      <div class="cards">
        <div class="card">
          <h3>📱 Phone / Kiosk</h3>
          <p class="muted">Enter name, take a selfie, send it to the screen.</p>
          <a href="kiosk.html">Open kiosk</a>
        </div>
        <div class="card">
          <h3>📺 Big screen / LED</h3>
          <p class="muted">Open this on the TV. Press <b>T</b> to test the animation.</p>
          <a href="display.html">Open display</a>
        </div>
      </div>
    </main>

    <script src="js/qrcode.min.js"></script>
    <script>
      // Build an absolute URL to the kiosk and render a QR code for it.
      var kioskUrl = new URL('kiosk.html', window.location.href).href;
      document.getElementById('kiosk-link-text').textContent = kioskUrl;
      try {
        new QRCode(document.getElementById('qr'), {
          text: kioskUrl,
          width: 220,
          height: 220,
        });
      } catch (e) {
        document.getElementById('qr').textContent = 'QR unavailable';
      }
    </script>
  </body>
</html>
